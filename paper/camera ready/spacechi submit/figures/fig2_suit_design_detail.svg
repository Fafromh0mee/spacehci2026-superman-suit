<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b3b82"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1359b7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b2aa5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#df2027"/>
    </marker>
    <filter id="line-halo" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="dilate"/>
      <feFlood flood-color="white" result="white"/>
      <feComposite in="white" in2="dilate" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <image x="0" y="0" width="1672" height="941"
         xlink:href="fig2_suit_design_detail_base.png"/>

  <!-- Keyed targets replace crowded and ambiguous exploded-view arrows. -->
  <g font-family="Arial" font-size="15" font-weight="700"
     text-anchor="middle" dominant-baseline="middle">
    <g stroke="#0b3b82" stroke-width="2.5" fill="white">
      <line x1="660" y1="105" x2="690" y2="132"/>
      <circle cx="650" cy="96" r="14"/><text x="650" y="97" fill="#0b3b82" stroke="none">1</text>

      <line x1="679" y1="292" x2="704" y2="309"/>
      <circle cx="667" cy="284" r="14"/><text x="667" y="285" fill="#0b3b82" stroke="none">2</text>

      <line x1="867" y1="292" x2="838" y2="309"/>
      <circle cx="880" cy="284" r="14"/><text x="880" y="285" fill="#0b3b82" stroke="none">3</text>

      <line x1="821" y1="489" x2="844" y2="505"/>
      <circle cx="808" cy="480" r="14"/><text x="808" y="481" fill="#0b3b82" stroke="none">4</text>

      <line x1="916" y1="524" x2="887" y2="542"/>
      <circle cx="930" cy="516" r="14"/><text x="930" y="517" fill="#0b3b82" stroke="none">5</text>
    </g>
    <g stroke="#df2027" stroke-width="2.5" fill="white">
      <line x1="609" y1="395" x2="583" y2="417"/>
      <circle cx="622" cy="385" r="14"/><text x="622" y="386" fill="#c91f26" stroke="none">6</text>
    </g>
  </g>

  <!-- Concise, physically grounded callouts. Each leader has one target. -->
  <g font-family="Arial">
    <g fill="white" fill-opacity="0.97" stroke="#0b3b82" stroke-width="1.6">
      <rect x="1022" y="62" width="166" height="72" rx="9"/>
      <rect x="1022" y="154" width="166" height="82" rx="9"/>
      <rect x="1022" y="252" width="166" height="74" rx="9"/>
      <rect x="1022" y="342" width="166" height="74" rx="9"/>
      <rect x="1022" y="432" width="166" height="78" rx="9"/>
    </g>

    <g fill="#0a2b62" font-weight="700" font-size="17">
      <text x="1036" y="87">PV OUTER SHELL</text>
      <text x="1036" y="179">CONTROLLER</text>
      <text x="1036" y="277">REMOVABLE</text>
      <text x="1036" y="298">STORAGE</text>
      <text x="1036" y="367">SENSOR NODES</text>
      <text x="1036" y="457">NMES ELECTRODES</text>
    </g>
    <g fill="#22395d" font-size="14">
      <text x="1036" y="110">flexible light harvesting</text>
      <text x="1036" y="202">isolation + charge</text>
      <text x="1036" y="220">regulation + NMES driver</text>
      <text x="1036" y="317">sealed removable battery</text>
      <text x="1036" y="389">contact + impedance</text>
      <text x="1036" y="407">temperature + motion</text>
      <text x="1036" y="480">soft pads over selected</text>
      <text x="1036" y="498">muscle groups</text>
    </g>

    <g fill="none" stroke="#0b3b82" stroke-width="2.4"
       marker-end="url(#arrow-navy)" filter="url(#line-halo)">
      <polyline points="1022,101 996,101 996,132 736,132"/>
      <polyline points="1022,195 990,195 990,315 720,315"/>
      <polyline points="1022,289 980,289 980,315 828,315"/>
      <polyline points="1022,379 970,379 970,505 844,505"/>
      <polyline points="1022,471 960,471 960,542 884,542"/>
    </g>
    <g fill="white" stroke="#0b3b82" stroke-width="2">
      <circle cx="736" cy="132" r="5"/>
      <circle cx="720" cy="315" r="5"/>
      <circle cx="828" cy="315" r="5"/>
      <circle cx="844" cy="505" r="5"/>
      <circle cx="884" cy="542" r="5"/>
    </g>
  </g>

  <!-- Deterministic bottom logic: sensing and user command enter the controller;
       stimulation leaves the controller and reaches the electrodes. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#line-halo)">
    <polyline points="1120,825 1000,825 1000,850"
              stroke="#6b2aa5" stroke-width="3" stroke-dasharray="8 6"
              marker-end="url(#arrow-purple)"/>
    <polyline points="1188,872 1010,872"
              stroke="#1359b7" stroke-width="3" stroke-dasharray="8 6"
              marker-end="url(#arrow-blue)"/>
    <polyline points="1008,897 1008,916 1402,916 1402,875 1415,875"
              stroke="#1359b7" stroke-width="3.2"
              marker-end="url(#arrow-blue)"/>
  </g>
</svg>
